# Apple swift-format owns formatting. These rules catch correctness mistakes
# without duplicating whitespace, naming, or length preferences.
included:
  - Latest
  - UpdateInstaller
  - Tests
  - script
only_rules:
  - force_cast
  - force_try
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicated_key_in_dictionary_literal
  - discarded_notification_center_observer
  - unused_closure_parameter
  - unused_optional_binding
  - unused_enumerated
  - unused_setter_value
  - private_unit_test
  - blanket_disable_command
  - superfluous_disable_command

# Advisory: source reachability cannot prove runtime or cross-module use.
# unused_import is omitted because SourceKit reports circular references in
# the conditional release-notes audit on Swift 6.4.
analyzer_rules:
  - unused_declaration
unused_declaration:
  severity: warning
