name: macOS CI

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare tools and visual diagnostics
        run: |
          command -v rg >/dev/null || brew install ripgrep
          xcodebuild -version
          swift --version
          mkdir -p /tmp/latest-visual-output

      - name: Resolve pinned dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Latest.xcodeproj -scheme Latest \
            -derivedDataPath build/DerivedData \
            -onlyUsePackageVersionsFromResolvedFile
          git diff --exit-code -- Latest.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Render immutable original on this runner
        run: ./script/prepare_ci_visual_reference.sh

      - name: Run structure, behavior, and visual gates
        run: ./script/test.sh

      - name: Require exact pixels against original app
        run: |
          swiftc -O script/report_visual_parity.swift -o /tmp/latest-visual-parity
          /tmp/latest-visual-parity build/ci-visual-reference /tmp/latest-visual-output --require-exact

      - name: Preserve test results and visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: |
            build/*.xcresult
            build/production-visuals/*.png
            build/ci-visual-reference/*.png
            /tmp/latest-visual-output/*.png
          if-no-files-found: warn
          retention-days: 14
