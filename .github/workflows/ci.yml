name: macOS CI

on:
  push:
    branches: [develop]
  pull_request:

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run structure and test gates
        run: ./script/test.sh
